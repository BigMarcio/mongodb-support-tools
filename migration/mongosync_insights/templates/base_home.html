<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mongosync Insights{% endblock %}</title>
    {% include '_theme_vars.html' %}
    {% block plotly_head %}{% endblock %}
    <script>
    window.MI_LOGS = {
        list: {{ url_for('logs.list_snapshots')|tojson }},
        loadT: {{ url_for('logs.load_snapshot_view', snapshot_id='__ID__')|tojson }},
        delT: {{ url_for('logs.delete_snapshot_view', snapshot_id='__ID__')|tojson }}
    };
    </script>
    <link rel="stylesheet" href="/static/css/mi-base-home.css">
    <style>{% block styles %}{% endblock %}</style>
    {% block head_links %}{% endblock %}
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        {% block footer %}{% endblock %}
    </footer>

    <!-- Upload loading overlay -->
    <div id="uploadLoadingOverlay" class="upload-loading-overlay">
        <div class="upload-loading-spinner"></div>
        <h3>Processing Files...</h3>
        <p>Parsing and analyzing data.</p>
    </div>

    <script src="/static/js/mi-a11y.js"></script>
    <script src="/static/js/mi-snapshots.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
