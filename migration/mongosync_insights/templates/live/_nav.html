{% if nav %}
<nav class="lm-live-nav" aria-label="Live monitoring navigation">
    {% if nav.show_dashboard %}
    <a href="{{ url_for('live.dashboard') }}"
       class="lm-live-nav-link{% if nav.active_page == 'dashboard' %} is-active{% endif %}"
       {% if nav.active_page == 'dashboard' %}aria-current="page"{% endif %}>
        Dashboard
    </a>
    {% endif %}
    {% if nav.show_full_migration %}
    <a href="{{ url_for('live.migration_view') }}"
       class="lm-live-nav-link{% if nav.active_page == 'migration' %} is-active{% endif %}"
       {% if nav.active_page == 'migration' %}aria-current="page"{% endif %}>
        Full Migration Monitoring
    </a>
    {% endif %}
    {% if nav.show_full_verifier %}
    <a href="{{ url_for('live.verifier_view') }}"
       class="lm-live-nav-link{% if nav.active_page == 'verifier' %} is-active{% endif %}"
       {% if nav.active_page == 'verifier' %}aria-current="page"{% endif %}>
        Full Migration Verifier
    </a>
    {% endif %}
</nav>
{% endif %}
