name: Mongosync Insights Tests

on:
  push:
    paths:
      - "migration/mongosync_insights/**"
      - ".github/workflows/mongosync-insights-tests.yml"
  pull_request:
    paths:
      - "migration/mongosync_insights/**"
      - ".github/workflows/mongosync-insights-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/mongosync_insights
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            migration/mongosync_insights/requirements.txt
            migration/mongosync_insights/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q
