name: Mongosync Insights Tests

on:
  push:
    paths:
      - "migration/mongosync_insights/**"
      - ".github/workflows/mongosync-insights-tests.yml"
  pull_request:
    paths:
      - "migration/mongosync_insights/**"
      - ".github/workflows/mongosync-insights-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/mongosync_insights
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            migration/mongosync_insights/requirements.txt
            migration/mongosync_insights/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q
