name: Mongosync Insights Release

on:
  push:
    tags:
      - "MIv*"

permissions:
  contents: read

defaults:
  run:
    working-directory: migration/mongosync_insights

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/MIv* ]]; then
            version="${GITHUB_REF#refs/tags/MIv}"
          else
            echo "ERROR: Releases require an MIv* tag push (got ${GITHUB_REF})." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"

      - name: Verify tag matches APP_VERSION
        shell: bash
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          app_version=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('lib/app_config.py').read_text()
          m = re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1) if m else '')
          ")
          if [[ -z "${app_version}" ]]; then
            echo "ERROR: Could not read APP_VERSION from lib/app_config.py" >&2
            exit 1
          fi
          if [[ "${tag_version}" != "${app_version}" ]]; then
            echo "ERROR: Tag MIv${tag_version} must match APP_VERSION (${app_version}) in lib/app_config.py" >&2
            exit 1
          fi
          echo "APP_VERSION matches tag: ${app_version}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            migration/mongosync_insights/requirements.txt
            migration/mongosync_insights/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  build-macos-arm64:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build macOS arm64 binary
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh --arch arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: migration/mongosync_insights/dist/mongosync-insights-${{ needs.test.outputs.version }}-macos-arm64
          if-no-files-found: error

  build-ubuntu-amd64:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.11 python3.11-venv python3-pip ruby-rubygems build-essential
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          sudo gem install fpm

      - name: Build Ubuntu amd64 package
        run: |
          chmod +x build_ubuntu.sh
          ./build_ubuntu.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-amd64
          path: migration/mongosync_insights/dist/mongosync-insights_${{ needs.test.outputs.version }}-1.ubuntu_amd64.deb
          if-no-files-found: error

  build-amazonlinux-x86_64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: amazonlinux:2023
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build Amazon Linux x86_64 package
        run: |
          chmod +x build_amazonlinux.sh
          ./build_amazonlinux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amazonlinux-x86_64
          path: migration/mongosync_insights/dist/mongosync-insights-${{ needs.test.outputs.version }}-1.amzn.x86_64.rpm
          if-no-files-found: error

  build-rhel8-x86_64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: rockylinux:8
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm -v 1.16.0 --no-document

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build RHEL 8 x86_64 package
        run: |
          chmod +x build_rhel.sh
          ./build_rhel.sh --el-major 8

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhel8-x86_64
          path: migration/mongosync_insights/dist/mongosync-insights-${{ needs.test.outputs.version }}-1.el8.x86_64.rpm
          if-no-files-found: error

  build-rhel9-x86_64:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: rockylinux:9
    steps:
      - name: Install build prerequisites
        working-directory: /
        run: |
          dnf install -y \
            git tar gzip gcc rpm-build ruby rubygems \
            python3.11 python3.11-pip
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          gem install fpm

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build RHEL 9 x86_64 package
        run: |
          chmod +x build_rhel.sh
          ./build_rhel.sh --el-major 9

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhel9-x86_64
          path: migration/mongosync_insights/dist/mongosync-insights-${{ needs.test.outputs.version }}-1.el9.x86_64.rpm
          if-no-files-found: error

  release:
    needs:
      - test
      - build-macos-arm64
      - build-ubuntu-amd64
      - build-amazonlinux-x86_64
      - build-rhel8-x86_64
      - build-rhel9-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Package source archives
        run: |
          chmod +x migration/mongosync_insights/ci/package_source_archives.sh
          migration/mongosync_insights/ci/package_source_archives.sh \
            "${{ needs.test.outputs.version }}" artifacts

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Render release notes
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          sed "s/<version>/${VERSION}/g" \
            migration/mongosync_insights/ci/RELEASE_DOWNLOADS.md \
            > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mongosync Insights v${{ needs.test.outputs.version }}
          body_path: /tmp/release-body.md
          files: artifacts/**
